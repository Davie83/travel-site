# ============================================================================
#  Netlify 배포 설정
#  이 파일이 있으면 Netlify 가 알아서 빌드하고 dist 폴더를 배포합니다.
#  화면에서 따로 설정할 것이 없습니다.
# ============================================================================

[build]
  command = "npm run build"    # build.js 실행 (설치할 패키지 없음)
  publish = "dist"             # 이 폴더가 실제 사이트가 됩니다

[build.environment]
  NODE_VERSION = "20"

# ---- 기본 보안 헤더 --------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---- 정적 파일 캐시 (1시간) ------------------------------------------------
#  파일명에 버전이 붙지 않으므로 너무 길게 잡으면 디자인 수정이 늦게 반영됩니다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
