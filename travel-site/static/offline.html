<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>오프라인 — Davie's K-Food Trip</title>
<style>
  :root { color-scheme: light dark; --ground:#ffffff; --ink:#14171a; --mute:#6b7280; --line:#e5e7eb; --navy:#312a7e; }
  @media (prefers-color-scheme: dark) { :root { --ground:#0f1114; --ink:#e9ecef; --mute:#9aa3ad; --line:#232830; --navy:#827adc; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--ground); color:var(--ink);
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .box { max-width:26rem; padding:2.5rem 1.5rem; text-align:center; }
  .box img { width:72px; height:72px; margin-bottom:1.25rem; }
  h1 { font-size:1.25rem; margin:0 0 .5rem; letter-spacing:-.02em; }
  p { margin:.25rem 0; color:var(--mute); }
  button { margin-top:1.5rem; padding:.7rem 1.4rem; font:inherit; font-weight:600;
    border:1px solid var(--navy); border-radius:999px; background:var(--navy); color:#fff; cursor:pointer; }
  button:hover { opacity:.9; }
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/icons/icon-192.png" alt="">
    <h1>오프라인 상태입니다</h1>
    <p>인터넷 연결이 끊겨 이 페이지를 불러올 수 없습니다.</p>
    <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <p style="font-size:.9em">You're offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">다시 시도 · Retry</button>
  </div>
</body>
</html>
