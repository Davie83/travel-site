<!DOCTYPE html>
<!-- 모든 페이지의 공통 뼈대. 여기를 고치면 전 언어·전 페이지에 반영됩니다. -->
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="naver-site-verification" content="7f74afc03d6438fea3259dd291ccf3e4e72ff607" />

<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{noindex}}
<link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{lbase}}feed.xml">

<!-- 같은 글의 다른 언어판을 검색엔진에 알립니다 -->
{{hreflang}}

<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="{{ogImageW}}">
<meta property="og:image:height" content="{{ogImageH}}">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">

<!-- 파비콘 — 여권 스탬프(이중 링) 안에 밥 한 술 뜬 숟가락. 여행 + 국밥 한 그릇. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23312a7e' stroke-width='2'/><circle cx='16' cy='16' r='9.6' fill='none' stroke='%23312a7e' stroke-width='1.3' stroke-dasharray='2 2'/><path d='M9.8 18h12.4a6.2 5 0 0 1-12.4 0Z' fill='%23c25e10'/><ellipse cx='15.4' cy='12.9' rx='4.1' ry='2.5' fill='%23c25e10'/><path d='M19.2 12.5 24.6 11' fill='none' stroke='%23c25e10' stroke-width='1.9' stroke-linecap='round'/><g fill='%23ffffff'><ellipse cx='13.7' cy='12' rx='1' ry='.55' transform='rotate(28 13.7 12)'/><ellipse cx='15.2' cy='11.2' rx='1' ry='.55' transform='rotate(-12 15.2 11.2)'/><ellipse cx='16.7' cy='11.9' rx='1' ry='.55' transform='rotate(40 16.7 11.9)'/><ellipse cx='14.6' cy='12.7' rx='1' ry='.55' transform='rotate(-32 14.6 12.7)'/><ellipse cx='16.1' cy='12.8' rx='1' ry='.55' transform='rotate(8 16.1 12.8)'/></g></svg>">

<!-- PWA — "홈 화면에 추가" 하면 앱처럼 실행됩니다 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="K-Food Trip">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
/* 테마 — 첫 그림이 그려지기 전에 정해야 화면이 번쩍이지 않습니다.
   그래서 이 조각만 예외적으로 head 안에 인라인으로 둡니다.
   값이 없으면 속성을 붙이지 않고, CSS 의 prefers-color-scheme 이
   기기 설정을 그대로 따릅니다. */
(function () {
  try {
    var v = localStorage.getItem('kfoodtrip.theme');
    if (v === 'dark' || v === 'light') {
      document.documentElement.setAttribute('data-theme', v);
    }
  } catch (e) { /* 저장 공간이 막힌 브라우저는 기기 설정을 따릅니다 */ }
})();
</script>
<!-- 본문 글꼴 Pretendard (가변 폰트 · 동적 서브셋 — 쓰는 글자만 내려받고 font-display:swap.
     불러오지 못하면 style.css 의 --kr 폴백 스택(맑은 고딕·Apple SD 등)으로 자동 대체됩니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{base}}assets/style.css?v={{v}}">
{{regionVars}}

{{adsense}}
{{headExtra}}
</head>

<body data-base="{{base}}" data-supabase-url="{{supabaseUrl}}" data-supabase-key="{{supabaseKey}}">
<a class="skip" href="#main">{{skip}}</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{homeHref}}"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="lm-ring" cx="16" cy="16" r="13" fill="none" stroke-width="2"/><circle class="lm-ring" cx="16" cy="16" r="9.6" fill="none" stroke-width="1.3" stroke-dasharray="2 2"/><path class="lm-bowl" d="M9.8 18h12.4a6.2 5 0 0 1-12.4 0Z"/><ellipse class="lm-bowl" cx="15.4" cy="12.9" rx="4.1" ry="2.5"/><path class="lm-spoon" d="M19.2 12.5 24.6 11" fill="none" stroke-width="1.9" stroke-linecap="round"/><g class="lm-rice"><ellipse cx="13.7" cy="12" rx="1" ry=".55" transform="rotate(28 13.7 12)"/><ellipse cx="15.2" cy="11.2" rx="1" ry=".55" transform="rotate(-12 15.2 11.2)"/><ellipse cx="16.7" cy="11.9" rx="1" ry=".55" transform="rotate(40 16.7 11.9)"/><ellipse cx="14.6" cy="12.7" rx="1" ry=".55" transform="rotate(-32 14.6 12.7)"/><ellipse cx="16.1" cy="12.8" rx="1" ry=".55" transform="rotate(8 16.1 12.8)"/></g></svg><span class="logo-text"><span class="logo-name">{{siteName}}</span><span class="logo-tag">{{slogan}}</span></span></a>
    {{langs}}
    <button class="theme-btn" type="button" aria-label="{{themeToggle}}" title="{{themeToggle}}">
      <span class="theme-sun" aria-hidden="true">☀</span><span class="theme-moon" aria-hidden="true">🌙</span>
    </button>
    {{savedLink}}
    <button class="nav-toggle" type="button" aria-label="{{menuOpen}}" aria-expanded="false">☰</button>
    <nav class="nav">
      {{nav}}
    </nav>
  </div>
</header>

{{langSuggest}}

<main id="main">
{{body}}
</main>

<button class="to-top" type="button" aria-label="{{toTop}}" title="{{toTop}}">
  <span aria-hidden="true">↑</span>
</button>

{{savedStrip}}

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-links">
      <a href="{{lbase}}tips">{{footTips}}</a>
      <a href="{{lbase}}about">{{footAbout}}</a>
      <a href="{{lbase}}contact">{{footContact}}</a>
      <a href="{{lbase}}privacy">{{footPrivacy}}</a>
    </div>
    <div class="footer-copy">© {{year}} {{siteName}}</div>
  </div>
</footer>

<script src="{{base}}assets/filter.js?v={{v}}" defer></script>
<script src="{{base}}assets/reactions.js?v={{v}}" defer></script>
<script src="{{base}}assets/saved.js?v={{v}}" defer></script>
<script src="{{base}}assets/totop.js?v={{v}}" defer></script>
<script>
/* 서비스워커 등록 — PWA 오프라인 대응. 실패해도 사이트는 그대로 동작합니다. */
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
