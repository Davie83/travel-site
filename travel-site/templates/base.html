<!DOCTYPE html>
<!-- 모든 페이지의 공통 뼈대. 여기를 고치면 전 언어·전 페이지에 반영됩니다. -->
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="naver-site-verification" content="7f74afc03d6438fea3259dd291ccf3e4e72ff607" />

<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{noindex}}
<link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{lbase}}feed.xml">

<!-- 같은 글의 다른 언어판을 검색엔진에 알립니다 -->
{{hreflang}}

<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="{{ogImageW}}">
<meta property="og:image:height" content="{{ogImageH}}">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<script>
/* 테마 — 첫 그림이 그려지기 전에 정해야 화면이 번쩍이지 않습니다.
   그래서 이 조각만 예외적으로 head 안에 인라인으로 둡니다.
   값이 없으면 속성을 붙이지 않고, CSS 의 prefers-color-scheme 이
   기기 설정을 그대로 따릅니다. */
(function () {
  try {
    var v = localStorage.getItem('kfoodtrip.theme');
    if (v === 'dark' || v === 'light') {
      document.documentElement.setAttribute('data-theme', v);
    }
  } catch (e) { /* 저장 공간이 막힌 브라우저는 기기 설정을 따릅니다 */ }
})();
</script>
<link rel="stylesheet" href="{{base}}assets/style.css?v={{v}}">
{{regionVars}}

{{adsense}}
{{headExtra}}
</head>

<body data-base="{{base}}" data-supabase-url="{{supabaseUrl}}" data-supabase-key="{{supabaseKey}}">
<a class="skip" href="#main">{{skip}}</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{homeHref}}">{{siteName}}</a>
    {{langs}}
    <button class="theme-btn" type="button" aria-label="{{themeToggle}}" title="{{themeToggle}}">
      <span class="theme-sun" aria-hidden="true">☀</span><span class="theme-moon" aria-hidden="true">🌙</span>
    </button>
    {{savedLink}}
    <button class="nav-toggle" type="button" aria-label="{{menuOpen}}" aria-expanded="false">☰</button>
    <nav class="nav">
      {{nav}}
    </nav>
  </div>
</header>

{{langSuggest}}

<main id="main">
{{body}}
</main>

<button class="to-top" type="button" aria-label="{{toTop}}" title="{{toTop}}">
  <span aria-hidden="true">↑</span>
</button>

{{savedStrip}}

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-links">
      <a href="{{lbase}}tips">{{footTips}}</a>
      <a href="{{lbase}}about">{{footAbout}}</a>
      <a href="{{lbase}}contact">{{footContact}}</a>
      <a href="{{lbase}}privacy">{{footPrivacy}}</a>
    </div>
    <div class="footer-copy">© {{year}} {{siteName}}</div>
  </div>
</footer>

<script src="{{base}}assets/filter.js?v={{v}}" defer></script>
<script src="{{base}}assets/reactions.js?v={{v}}" defer></script>
<script src="{{base}}assets/saved.js?v={{v}}" defer></script>
<script src="{{base}}assets/totop.js?v={{v}}" defer></script>
</body>
</html>
