  <!-- 홈 = 지역 인덱스. 왼쪽은 글, 오른쪽은 지도(지역 핀 클릭 가능) -->
  <section class="hero hero-split">
    <div class="wrap hero-inner">
      <div class="hero-text">
        <h1>{{tagline}}</h1>
        <p>{{description}}</p>
        <!-- 검색창 오른쪽에 "내 근처" 를 둡니다.
             왼쪽은 계획해서 찾는 방식, 오른쪽은 지금 서 있는 자리에서 찾는 방식입니다.
             위치는 브라우저 안에서만 쓰고 어디에도 보내지 않습니다. -->
        <div class="search-box near" data-target="latest-grid"
             data-t-busy="{{nearBusy}}" data-t-done="{{nearDone}}" data-t-deny="{{nearDeny}}"
             data-t-far="{{nearFar}}" data-t-none="{{nearNone}}"
             data-t-me="{{nearMe}}" data-t-empty="{{nearEmpty}}" data-t-count="{{nearCount}}"
             data-hl="{{hl}}">
          <input id="search" type="search" placeholder="{{searchPlaceholder}}" aria-label="{{searchPlaceholder}}" data-target="latest-grid">
          <button class="near-btn" type="button" title="{{nearTitle}}">📍 <span>{{nearTitle}}</span></button>
        </div>
        <p class="near-line">
          <span class="near-msg" aria-live="polite"></span>
        </p>

        <!-- 내 근처 모달. 처음에는 비어 있고 위치를 받은 뒤 스크립트가 채웁니다.
             지도는 구글 임베드 위에 핀을 계산해 얹는 방식이라, 확대·축소는
             아래 +/- 버튼으로 하고 누를 때마다 지도와 핀을 함께 다시 그립니다. -->
        <div class="nearmodal" hidden role="dialog" aria-modal="true" aria-label="{{nearTitle}}">
          <div class="nm-panel">
            <div class="nm-head">
              <strong class="nm-title">📍 {{nearTitle}}</strong>
              <span class="nm-msg" aria-live="polite"></span>
              <button class="nm-close" type="button" aria-label="{{nearClose}}">✕</button>
            </div>
            <div class="nm-radius" role="group">
              <button type="button" data-km="1">1km</button>
              <button type="button" data-km="3" class="on">3km</button>
              <button type="button" data-km="10">10km</button>
              <button type="button" data-km="0">{{nearAll}}</button>
            </div>
            <div class="nm-mapwrap">
              <div class="nm-map"></div>
              <div class="nm-zoom">
                <button class="nm-in" type="button" aria-label="{{nearZoomIn}}">+</button>
                <button class="nm-out" type="button" aria-label="{{nearZoomOut}}">−</button>
              </div>
            </div>
            <ul class="nm-list"></ul>
          </div>
        </div>
        <!-- 검색 중에만 나옵니다. 결과가 화면 아래에 있다는 것을 알려주는 줄입니다
             (검색해도 위쪽 화면이 그대로라 결과를 못 찾는 일이 있었습니다) -->
        <p class="search-note" data-target="latest-grid" data-tpl="{{searchCountTpl}}"
           data-jump="{{searchJump}}" data-none="{{noResult}}" aria-live="polite" hidden></p>
      </div>
{{map}}
    </div>
  </section>

  <div class="wrap">

    <section class="section">
      <div class="section-head">
        <h2>{{findByRegion}}</h2>
        <span class="more">{{regionCount}}</span>
      </div>
      <div class="regions">
{{regions}}
      </div>
    </section>

    <section class="section">
      <a class="tips-card" href="{{tipsHref}}">
        <span class="tips-ico" aria-hidden="true">🧭</span>
        <span class="tips-body">
          <strong class="tips-title">{{tipsTitle}}</strong>
          <span class="tips-desc">{{tipsDesc}}</span>
          <span class="tips-tags">{{tipsTags}}</span>
        </span>
        <span class="tips-cta">{{tipsCta}} →</span>
      </a>
    </section>

    {{adTop}}

    <section class="section">
      <!-- 검색 중에는 제목이 "검색 결과" 로 바뀝니다. filter.js 가 data-search 를 씁니다 -->
      <div class="section-head">
        <h2 data-default="{{latestTitle}}" data-search="{{searchTitle}}">{{latestTitle}}</h2>
        <span class="more search-count" hidden></span>
      </div>
      <!-- limit-4 : 평소에는 한 행(4개)만 보이고, 검색하면 전체에서 찾습니다 -->
      <div class="grid limit-4" id="latest-grid">
{{latest}}
      </div>
      <p class="empty" hidden>{{noResult}}</p>
    </section>

    {{adBottom}}

  </div>
