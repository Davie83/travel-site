  <!-- 홈 = 지역 인덱스 -->
  <section class="hero">
    <div class="wrap">
      <h1>{{tagline}}</h1>
      <p>{{description}}</p>
      <div class="search-box">
        <input id="search" type="search" placeholder="{{searchPlaceholder}}" aria-label="{{searchPlaceholder}}" data-target="latest-grid">
      </div>
    </div>
  </section>

  <div class="wrap">

    <section class="section">
      <div class="section-head">
        <h2>{{findByRegion}}</h2>
        <span class="more">{{regionCount}}</span>
      </div>
      <div class="regions">
{{regions}}
      </div>
    </section>

    {{adTop}}

    <section class="section">
      <div class="section-head"><h2>{{latestTitle}}</h2></div>
      <!-- limit-6 : 평소에는 6개만 보이고, 검색하면 전체에서 찾습니다 -->
      <div class="grid limit-6" id="latest-grid">
{{latest}}
      </div>
      <p class="empty" hidden>{{noResult}}</p>
    </section>

    {{adBottom}}

  </div>
