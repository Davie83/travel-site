  <!-- 글 상세 -->
  <article class="post" style="--r:var(--region-{{regionSlug}})"
           data-closed="{{closed}}" data-t-days="{{dayNames}}" data-t-closedtoday="{{closedTodayTpl}}">
    <p class="closed-today" hidden></p>

{{breadcrumb}}
{{eyebrow}}

    <header class="post-head">
      <div class="post-identity">
        <div class="post-id-row">
          <span class="post-emblem" aria-hidden="true">{{emblem}}</span>
          <h1>{{title}}</h1>
        </div>
{{lead}}
{{pills}}
{{byline}}
{{hero}}
      </div>

      <div class="post-aside-col">
{{aside}}
        {{saveBtn}}
      </div>
    </header>

    {{adTop}}

    <div class="post-body">
{{content}}
    </div>

    {{adBottom}}

{{tagChips}}

{{tipsNudge}}

    {{reactions}}

    {{related}}

  </article>
