  <!-- 글 상세 페이지 본문 -->
  <article class="post">

    <header class="post-head">
      <div class="kicker">{{kicker}}</div>
      <h1>{{title}}</h1>
      <p class="meta">{{meta}}</p>
    </header>

    <div class="ad-slot" data-ad="post-top">광고 영역 (본문 상단)</div>

    {{infoTable}}

    <div class="post-body">
{{content}}
    </div>

    <div class="ad-slot" data-ad="post-bottom">광고 영역 (본문 하단)</div>

    {{reactions}}

    {{related}}

  </article>
