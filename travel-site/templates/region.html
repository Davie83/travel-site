  <!-- 지역 페이지 — "부산 맛집" 같은 검색이 도착하는 곳 -->
  <section class="region-head" style="--r:var(--region-{{regionSlug}})">
    <div class="wrap">
      <span class="r-en">{{regionEn}}</span>
      <h1>{{regionName}}</h1>
    </div>
  </section>

{{intro}}
  <!-- 이 지역 추천 코스 (해당 지역 글로 시작하는 것만) + "내 주변" 위젯 -->
  <div class="wrap">
{{routeShelf}}
{{near}}
  </div>

  <div class="rtabs-bar">
    <div class="wrap rtabs" data-target="region-grid">
        {{tabs}}
    </div>
  </div>

  <!-- 장르 바로가기 칩 — 이 지역에 있는 음식 장르만. 그리드를 그 자리에서 좁힙니다 -->
{{genreChips}}

  <!-- 동네 칩 — 글이 있는 동네가 2곳 이상일 때만 채워집니다 -->
  <div class="wrap achips-wrap" data-target="region-grid">{{areaChips}}</div>

  <div class="wrap">
    {{adTop}}

    <section class="section">
      <div class="grid" id="region-grid">
{{cards}}
      </div>
      <p class="empty" hidden>{{noResult}}</p>
    </section>

    {{adBottom}}
  </div>
