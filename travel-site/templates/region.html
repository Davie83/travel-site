  <!-- 지역 페이지 — "부산 맛집" 같은 검색이 도착하는 곳 -->

    <div class="wrap">
      <span class="r-en">{{regionEn}}</span>
      <h1>{{regionName}}</h1>
    </div>
  </section>

  <div class="wrap">
{{routeShelf}}
  </div>

      </div>
