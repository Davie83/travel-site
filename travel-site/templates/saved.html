  <!-- 저장한 곳 (즐겨찾기) + 동선
       빌드 시점에는 방문자가 무엇을 저장했는지 알 수 없습니다.
       그래서 모든 글 카드를 위 칸에 넣어두고, assets/saved.js 가
       저장한 것만 위에 남기고 나머지는 아래 칸으로 옮깁니다.
       (카드를 두 번 넣지 않으므로 페이지가 무거워지지 않습니다)

       동선 칸(#route)은 그 카드들의 data-lat / data-lng / data-addr /
       data-closed 를 읽어서 만듭니다. 서버도, 지도 라이브러리도 쓰지 않습니다. -->
  <section class="hero">
    <div class="wrap">
      <h1>{{title}}</h1>
      <p>{{desc}}</p>
    </div>
  </section>

  <div class="wrap">
    <section class="section" id="saved-page">
      <div class="saved-bar">
        <p class="saved-count" aria-live="polite"></p>
        <button class="saved-clear" type="button" data-ask="{{clearAsk}}" hidden>{{clear}}</button>
      </div>

      <!-- 동선. 저장한 곳이 하나도 없으면 saved.js 가 숨깁니다 -->
      <section id="route" class="route"
               data-t-dir="{{routeDir}}" data-t-up="{{routeUp}}" data-t-down="{{routeDown}}"
               data-t-drop="{{routeDrop}}" data-t-copy="{{routeCopy}}" data-t-copied="{{routeCopied}}"
               data-t-closedwarn="{{routeClosedWarn}}" data-t-days="{{routeDayNames}}"
               data-t-unknown="{{routeUnknown}}" data-t-closedbadge="{{routeClosedBadge}}" data-t-nocoord="{{routeNoCoord}}" data-t-namewarn="{{routeNameWarn}}" data-t-origin="{{routeOrigin}}" data-t-maplabel="{{routeTitle}}"
               data-hl="{{hl}}" hidden>
        <div class="route-head">
          <h2>{{routeTitle}}</h2>
          <button class="route-sort" type="button">{{routeSort}}</button>
        </div>
        <p class="route-hint">{{routeHint}}</p>

        <!-- 출발지. 숙소를 넣어두면 첫 구간이 여기서 시작합니다 -->
        <div class="route-origin">
          <label for="route-origin-input">{{routeOrigin}}</label>
          <input id="route-origin-input" type="text" placeholder="{{routeOriginPh}}" autocomplete="off">
        </div>

        <!-- 동선 그림. 실제 지도가 아니라 위·경도로 위치 관계를 그린 것입니다.
             한국에서는 구글 지도가 여러 지점을 한 번에 못 그립니다 (saved.js 주석 참고) -->
        <div class="route-map" hidden></div>
        <p class="route-map-note">{{routeMapNote}}</p>

        <!-- 주소를 좌표로 바꾸는 동안 잠깐 나옵니다 -->
        <p class="route-busy" hidden>{{routeFinding}}</p>
        <ol class="route-list"></ol>
        <p class="route-warn" hidden></p>
        <div class="route-add">
          <label for="route-add-input">{{routeAddLabel}}</label>
          <div class="route-add-row">
            <input id="route-add-input" type="text" placeholder="{{routeAddPh}}" autocomplete="off">
            <button class="route-add-btn" type="button">{{routeAdd}}</button>
          </div>
        </div>

        <!-- 구글 내 지도로 가져갈 KML. 브라우저에서 만들어 내려받습니다 (서버 없음) -->
        <div class="route-export">
          <button class="route-export-btn" type="button">{{routeExport}}</button>
          <p class="route-export-hint">{{routeExportHint}}</p>
          <p class="route-skipped" data-tpl="{{routeSkipped}}" hidden></p>
        </div>
      </section>

      <div class="grid" id="saved-grid">
{{cards}}
      </div>
      <p class="empty saved-empty">{{empty}}</p>

      <!-- 저장하지 않은 글. 저장 목록만 보고 막히지 않도록 계속 둘러볼 수 있게 둡니다 -->
      <div id="saved-rest" hidden>
        <div class="section-head"><h2>{{others}}</h2></div>
        <div class="grid" id="saved-rest-grid"></div>
      </div>
    </section>
  </div>
