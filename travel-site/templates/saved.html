  <!-- 저장한 곳 (즐겨찾기)
       빌드 시점에는 방문자가 무엇을 저장했는지 알 수 없습니다.
       그래서 모든 글 카드를 넣어두고, assets/saved.js 가
       그 기기에 저장된 것만 보여주고 나머지는 숨깁니다. -->
  <section class="hero">
    <div class="wrap">
      <h1>{{title}}</h1>
      <p>{{desc}}</p>
    </div>
  </section>

  <div class="wrap">
    <section class="section" id="saved-page">
      <div class="saved-bar">
        <p class="saved-count" aria-live="polite"></p>
        <button class="saved-clear" type="button" data-ask="{{clearAsk}}" hidden>{{clear}}</button>
      </div>
      <div class="grid" id="saved-grid">
{{cards}}
      </div>
      <p class="empty saved-empty">{{empty}}</p>
    </section>
  </div>
